# Edge proxy: the only HTTP entrance to the API. Files never pass through here:
# uploads/downloads go straight to MinIO using signed URLs.

limit_req_zone $binary_remote_addr zone=downloads:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=writes:10m rate=5r/s;
limit_req_status 429;

upstream droplink_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_tokens off;
    client_max_body_size 64k;            # the API only receives small JSON bodies

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live status (SSE): never buffer, allow long-lived connections.
    location ~ ^/v1/files/[^/]+/events$ {
        proxy_pass http://droplink_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /d/ {
        limit_req zone=downloads burst=40 nodelay;
        proxy_pass http://droplink_api;
    }

    location = /v1/files {
        limit_req zone=writes burst=10 nodelay;
        proxy_pass http://droplink_api;
    }

    location / {
        proxy_pass http://droplink_api;
    }
}
