# Local development stack. Credentials below are DEV DEFAULTS: override them with a .env file
# (see .env.example) and never reuse them anywhere real.

x-app: &app
  build:
    context: .
    dockerfile: deploy/docker/Dockerfile
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DROPLINK_MONGO_URL: mongodb://mongo:27017
    DROPLINK_REDIS_URL: redis://redis:6379/0
    DROPLINK_MINIO_ENDPOINT: minio:9000
    DROPLINK_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-droplink}
    DROPLINK_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-droplink-dev-secret}
    DROPLINK_RATE_LIMIT_DOWNLOAD_PER_MINUTE: ${DROPLINK_RATE_LIMIT_DOWNLOAD_PER_MINUTE:-30}
  depends_on:
    mongo: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_healthy }

services:
  nginx:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [api]
    restart: unless-stopped

  api:
    <<: *app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  processor:
    <<: *app
    command: ["python", "-m", "workers.processor"]
    environment:
      <<: *app-env
      DROPLINK_WORKER_ID: processor-1

  janitor:
    <<: *app
    command: ["python", "-m", "workers.janitor"]
    environment:
      <<: *app-env
      DROPLINK_WORKER_ID: janitor-1

  mongo:
    image: mongo:7
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # persist counters across restarts
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-droplink}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-droplink-dev-secret}
    ports:
      - "9000:9000"   # S3 API: clients upload/download here using signed URLs
      - "9001:9001"   # web console
    volumes: [minio_data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mongo_data:
  redis_data:
  minio_data:
